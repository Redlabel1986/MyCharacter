  <line x1="14" y1="68" x2="70" y2="68" stroke="#2a180a" stroke-width="1.5"/>
  <line x1="42" y1="30" x2="42" y2="86" stroke="#2a180a" stroke-width="1.2" opacity="0.7"/>
  <!-- Nieten -->
  <circle cx="20" cy="36" r="1.8" fill="#d4af37"/>
  <circle cx="64" cy="36" r="1.8" fill="#d4af37"/>
  <circle cx="20" cy="80" r="1.8" fill="#d4af37"/>
