<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pergament-Hintergrund mit weichem Schatten -->
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1e3c4"/>
      <stop offset="100%" stop-color="#d8be8a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="url(#parchment)" stroke="#7a3a17" stroke-width="2" filter="url(#shadow)"/>
  <!-- Pergament-Aufrolle-Linien -->
  <line x1="6" y1="14" x2="58" y2="14" stroke="#7a3a17" stroke-width="0.6" opacity="0.4"/>
  <line x1="6" y1="50" x2="58" y2="50" stroke="#7a3a17" stroke-width="0.6" opacity="0.4"/>
  <!-- Schwert + Feder gekreuzt (Held + Papier) -->
  <g transform="translate(32 34) rotate(-32)">
    <!-- Schwertklinge -->
    <rect x="-1.5" y="-18" width="3" height="22" fill="#5e6d7a" stroke="#2a323a" stroke-width="0.4"/>
    <!-- Parierstange -->
    <rect x="-7" y="3" width="14" height="2" fill="#7a3a17" stroke="#3a1a08" stroke-width="0.3"/>
    <!-- Griff -->
    <rect x="-1.2" y="5" width="2.4" height="6" fill="#3a1a08"/>
    <!-- Knauf -->
    <circle cx="0" cy="12" r="1.6" fill="#7a3a17" stroke="#3a1a08" stroke-width="0.3"/>
  </g>
  <g transform="translate(32 34) rotate(32)">
    <!-- Federkiel als Kontrast -->
    <path d="M 0 -18 Q -3 -12 -2 -4 Q 0 4 0 8" fill="none" stroke="#2d1a0a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 -18 Q 3 -14 1 -10 Q -2 -8 0 -4" fill="#7a3a17" opacity="0.7"/>
    <path d="M 0 -10 Q 4 -8 1 -3 Q -2 -3 0 0" fill="#7a3a17" opacity="0.7"/>
  </g>
  <!-- "p" Initial unten -->
  <text x="32" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#7a3a17">paperheros</text>
</svg>
